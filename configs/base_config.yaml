# Base configuration for the FSLM pipeline
skill: math

# Student model
student_model: unsloth/Llama-3.2-3B-Instruct-bnb-4bit
device_map: auto

# Teacher model (via Groq API)
teacher_model: llama-3.3-70b-versatile

# Dataset paths
train_data_path: data/processed/math/train.jsonl
test_data_path: data/processed/math/test.jsonl

# Training
num_iterations: 3
num_epochs: 3
batch_size: 4
learning_rate: 2e-4
max_seq_length: 1024

# Inference
max_new_tokens: 500
temperature: 0.7

# Output
output_dir: outputs
